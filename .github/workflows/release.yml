name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  security-events: write

jobs:
  codeql:
    name: CodeQL Security Scan
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Build for analysis
        run: swift build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build:
    name: Build & Release
    needs: codeql
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug tests
        run: swift build

      - name: Run self tests
        run: swift run TodoPanel --selftest --sample=example/weeks/2026/2026-W24-0608-0614.md

      - name: Build & package .app
        run: ./build-app.sh

      - name: Zip the app
        run: |
          cd dist
          zip -r TodoPanel-macOS.zip TodoPanel.app
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TodoPanel-macOS.zip
          generate_release_notes: true
